[project]
name = "dmrlogger"
version = "0.1.0"
description = "Self-hosted BrandMeister DMR HBP recorder, transcriber, and Telegram topic poster"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Anton" }
]
dependencies = [
  "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.uv]
package = false
